services:
  # ===== CORE: OpenWA Backend API =====
  openwa-api:
    image: node:20-alpine
    container_name: openwa-api
    restart: unless-stopped
    working_dir: /app
    # Use a command that installs and runs directly to avoid build-time errors
    command: sh -c "npm install && npm start"
    ports:
      - '2785:2785'
    environment:
      - NODE_ENV=production
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - API_MASTER_KEY=owa_abcdef1234567890abcdef1234567890
    volumes:
      - .:/app
      - openwa-data:/app/data

  # ===== CORE: Dashboard Frontend =====
  dashboard:
    image: nginx:alpine
    container_name: openwa-dashboard
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./dashboard/dist:/usr/share/nginx/html:ro
    depends_on:
      - openwa-api

volumes:
  openwa-data:
    driver: local

networks:
  default:
    name: openwa-network
