services:
  openwa-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwa-api
    restart: unless-stopped
    ports:
      - '2785:2785'
    environment:
      - NODE_ENV=production
      - PORT=2785
      - API_MASTER_KEY=owa_abcdef1234567890abcdef1234567890
    volumes:
      - openwa-data:/app/data

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: openwa-dashboard
    restart: unless-stopped
    ports:
      - '2886:80'
    environment:
      - VITE_API_URL=https://wa-api.myskillscloud.com
    depends_on:
      - openwa-api

volumes:
  openwa-data:
    driver: local
